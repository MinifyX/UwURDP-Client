name: Mac App Store

# The Mac App Store build, beside the release rather than inside it: a tag
# starts this, installers.yml builds the GitHub downloads, and neither waits
# for the other. Also from Actions → Mac App Store → Run workflow.
#
#   build (no secrets) ── sign (only when the signing secrets exist)
#
# `build` compiles the universal app and an unsigned package. That alone shows
# the store build compiles, bundles and passes the checks in
# scripts/build-mas.mjs. `sign` runs on a fresh runner that has built and
# installed nothing, for a simple reason: the
# certificates never share a machine with a few hundred build scripts.
#
# Pull requests that touch what only this build uses get `check` instead:
# `build-mas.mjs --check`, a debug build for Apple silicon alone with the same
# checks. installers.yml's macOS check runs the same on every push to main and
# saves what it compiled (shared cache key `macos-dev`), so here only the
# workspace crates compile: minutes instead of the 20 a universal release build
# from scratch took, and no cache of its own. The Intel half and the release
# profile are compiled on main by installers.yml anyway.
#
# Only the desktop app: the store installs it, so there is no setup app.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mas.yml'
      - 'scripts/build-mas.mjs'
      - 'Cargo.lock'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'apps/desktop/src-tauri/capabilities/**'
      - 'apps/desktop/src-tauri/Info.plist'
      - 'apps/desktop/src-tauri/macos/**'
      - 'apps/desktop/src-tauri/tauri.mas.conf.json'
      - 'apps/desktop/src-tauri/tauri.macos.conf.json'
      - 'apps/desktop/src-tauri/src/lib.rs'
      - 'apps/desktop/src-tauri/src/h264.rs'
      - 'apps/desktop/src-tauri/src/hosts.rs'
      - 'apps/desktop/src-tauri/src/import.rs'
      - 'apps/desktop/src-tauri/src/sync.rs'
      - 'apps/desktop/src-tauri/src/system.rs'
      - 'apps/desktop/src-tauri/src/sandbox_access.rs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # As in installers.yml: the variables rust-cache hashes into its key have to
  # match for `check` to find the cache the macOS check saved there.
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (debug, Apple silicon)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Saved by installers.yml's macOS check on main; only read here.
          shared-key: macos-dev
          save-if: false
      - name: Build the store app (debug, unsigned) and check it
        run: node scripts/build-mas.mjs --check

  build:
    # Tags and Run workflow: what goes to the store, built from the lockfiles
    # alone, without any cache.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build the store app, unsigned
        env:
          MAS_BUILD_NUMBER: ${{ github.run_number }}
        run: pnpm build:mas

      # `ditto` keeps what an app bundle is made of — links, modes, extended
      # attributes — through the zip the artifact is.
      - name: Collect the app and the package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/universal-apple-darwin/release/bundle/macos/UwURDP.app dist/UwURDP-mas.app.zip
          cp target/release/UwURDP-*-mas-universal.pkg dist/
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mas-unsigned
          path: dist/*
          if-no-files-found: error

  # Whether there is anything to sign with. A job of its own, because a job's
  # `if` cannot read secrets; this one hands on a yes or a no and nothing else.
  secrets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CERTIFICATES: ${{ secrets.APPLE_MAS_CERTIFICATES_P12 }}
        run: echo "present=$([ -n "$CERTIFICATES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  sign:
    needs: [build, secrets]
    if: needs.secrets.outputs.present == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Only the script, not the workspace: nothing here installs or builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/build-mas.mjs
            apps/desktop/src-tauri/tauri.conf.json
            apps/desktop/src-tauri/macos
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mas-unsigned
          path: unsigned

      # A keychain of its own for this job, removed at the end however the job
      # ends. The .p12 holds both certificates: the application one that signs
      # the app and the installer one that signs the package.
      - name: Import the certificates and the provisioning profile
        env:
          CERTIFICATES: ${{ secrets.APPLE_MAS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATES_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/mas.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/mas.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/embedded.provisionprofile"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign the app and the package
        env:
          APPLE_MAS_APP_IDENTITY: ${{ secrets.APPLE_MAS_APP_IDENTITY }}
          APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ditto -x -k unsigned/UwURDP-mas.app.zip app
          mkdir -p target/release
          APPLE_MAS_PROVISIONING_PROFILE="$RUNNER_TEMP/embedded.provisionprofile" \
            node scripts/build-mas.mjs --sign app/UwURDP.app
          pkgutil --check-signature target/release/UwURDP-*-mas-universal.pkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mas-signed
          path: target/release/UwURDP-*-mas-universal.pkg
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/embedded.provisionprofile"
