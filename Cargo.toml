[workspace]
resolver = "2"
members = [
  "crates/uwurdp-core",
  "crates/uwurdp-import",
  "crates/uwurdp-proto",
  "crates/uwurdp-store",
  "crates/uwurdp-sync",
  "crates/uwurdp-vault",
  "apps/desktop/src-tauri",
  "apps/setup/src-tauri",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwURDP-Client"
rust-version = "1.89"

[workspace.dependencies]
uwurdp-core = { path = "crates/uwurdp-core" }
uwurdp-import = { path = "crates/uwurdp-import" }
uwurdp-proto = { path = "crates/uwurdp-proto" }
uwurdp-sync = { path = "crates/uwurdp-sync" }
uwurdp-store = { path = "crates/uwurdp-store" }
uwurdp-vault = { path = "crates/uwurdp-vault" }

anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Bundled SQLite, so the app never depends on whichever sqlite3.dll is around.
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.22"
windows-sys = "0.61"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding, not abort: a panic in one session's task must end that session,
# not the app with every other desktop in it (see uwurdp-core's manager).
panic = "unwind"
strip = true
