[package]
name = "uwurdp-setup"
description = "UwURDP's own installer, updater and uninstaller"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tar = "0.4"
tauri-build = { version = "2", features = [] }
zstd = "0.13"

[dependencies]
semver = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zstd = "0.13"

# macOS and Linux: the app arrives as a folder (an .app, an AppDir) packed as
# tar, and processes are found and ended through the C library.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
