<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UwURDP app icon: Nyu as a monitor on a stand, with cat ears">
  <title>UwURDP</title>
  <!--
    The website and GitHub icon, built like UwUMail's: Nyu slightly tilted on
    UwUMail's pastel pink tile (#FFF3F8 to #FFD3E5, the same for every UwU
    app), with sparkles and a heart arranged differently for each app.
    The monitor on its stand and the mouse pointer say remote desktop.
    Here: the heart top left, a small star left, a big star bottom right.
  -->
