[package]
name = "uwurdp-core"
description = "Session engine for UwURDP: RDP sessions on IronRDP, frames, input, clipboard"
version = "0.1.0-beta.3"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwURDP-Client"
# The floor IronRDP 0.17 itself declares.
rust-version = "1.89"

[features]
default = ["audio", "h264"]
# Plays remote audio on this machine (RDPSND over cpal). On Linux cpal links
# against ALSA, so building it needs libasound2-dev (Debian/Ubuntu) or
# alsa-lib-devel (Fedora). Turn the feature off to build without it.
audio = ["dep:ironrdp-rdpsnd", "dep:cpal"]
# H.264 in the graphics pipeline, decoded by Cisco's OpenH264 binary that the
# app downloads to the user's machine and names in the session settings. No
# decoder is compiled in: only Cisco's own binary carries their patent license.
h264 = ["dep:openh264"]

[dependencies]
ironrdp-connector = "0.10"
ironrdp-core = { version = "0.2", features = ["alloc"] }
ironrdp-cliprdr = "0.7"
ironrdp-displaycontrol = "0.8"
ironrdp-dvc = "0.8"
# The graphics pipeline's PDUs; the client side is ours (src/gfx).
ironrdp-egfx = "0.3"
ironrdp-graphics = "0.9"
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
ironrdp-session = "0.11"
ironrdp-svc = "0.8"
# Only the framing and the sans-I/O drivers; the `reqwest` feature is left off
# because we only speak NTLM (see `connect.rs`) and never need a KDC client.
ironrdp-tokio = "0.10"
ironrdp-rdpsnd = { version = "0.9", optional = true }
# Played through our own backend (src/audio.rs), not ironrdp-rdpsnd-native's:
# that one never starts its stream. Plain PCM only, so no Opus and no CMake.
cpal = { version = "0.17", optional = true }
# Only the loader for a prebuilt library (checked against Cisco's release
# hashes), no OpenH264 sources.
openh264 = { version = "0.9", default-features = false, features = ["libloading"], optional = true }

# `ring` instead of rustls' default `aws-lc-rs`: aws-lc needs CMake and NASM to
# build on Windows, ring needs nothing beyond the C compiler.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

arboard = { version = "3", default-features = false }
base64 = "0.22"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
# The toy server behind `examples/dev_rdpd.rs` and the integration tests.
# ironrdp-server pulls tokio-rustls with its default (aws-lc) provider, so the
# test build has both providers compiled in; every rustls config in this crate
# names its provider explicitly, which keeps that ambiguity harmless. With
# `egfx` it also serves the graphics pipeline.
ironrdp-server = { version = "0.13", features = ["egfx"] }
rcgen = "0.14"
anyhow = "1"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# OpenH264 built from source, to encode and decode test pictures. Tests only:
# the app never ships a source build (see the h264 feature).
openh264 = { version = "0.9", features = ["source"] }
