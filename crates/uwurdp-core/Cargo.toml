[package]
name = "uwurdp-core"
description = "Session engine for UwURDP: RDP sessions on IronRDP, frames, input, clipboard"
version = "0.2.0-beta.5"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwURDP-Client"
# The floor IronRDP itself declares.
rust-version = "1.89"

[features]
default = ["audio", "h264"]
# Plays remote audio on this machine (RDPSND over cpal). On Linux cpal links
# against ALSA, so building it needs libasound2-dev (Debian/Ubuntu) or
# alsa-lib-devel (Fedora). Turn the feature off to build without it.
audio = ["dep:cpal"]
# H.264 in the graphics pipeline, decoded by Cisco's OpenH264 binary that the
# app downloads to the user's machine and names in the session settings. No
# decoder is compiled in: only Cisco's own binary carries their patent license.
h264 = ["dep:openh264"]

[dependencies]
ironrdp-connector = "0.12"
# ironrdp-connector 0.12 pins picky =7.0.0-rc.26 but takes any sspi 0.23, and
# sspi 0.23.1 pins picky =7.0.0-rc.27: without this pin the two don't resolve.
# picky rc.26 takes p256 ^0.14, so russh 0.63 resolves next to us.
sspi = "=0.23.0"
ironrdp-core = { version = "0.3", features = ["alloc"] }
ironrdp-cliprdr = "0.9"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
# The graphics pipeline's PDUs; the client side is ours (src/gfx).
ironrdp-egfx = "0.5"
# Progressive and ClearCodec as Windows sends them (IronRDP #1443, #1696,
# #1698, #1703, #1728, #2134), all in 0.11.
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
# Only the framing and the sans-I/O drivers; the `reqwest` feature is left off
# because we only speak NTLM (see `connect.rs`) and never need a KDC client.
ironrdp-tokio = "0.12"
# Always in: drive redirection needs the sound channel announced too, even
# with sound off (MS-RDPEFS, appendix A <1>).
ironrdp-rdpsnd = "0.11"
# Drive redirection; the file system backend is ours (src/drive.rs), since
# ironrdp-rdpdr-native only builds on Unix.
ironrdp-rdpdr = "0.9"
# Played through our own backend (src/audio.rs), not ironrdp-rdpsnd-native's:
# that one never starts its stream. Plain PCM only, so no Opus and no CMake.
cpal = { version = "0.17", optional = true }
# Only the loader for a prebuilt library (checked against Cisco's release
# hashes), no OpenH264 sources.
openh264 = { version = "0.9", default-features = false, features = ["libloading"], optional = true }

# UDP for the session (MS-RDPBCGR multitransport): reliable RDP-UDP2 + TLS +
# RDPEMT, set up when the server asks for it on a direct connection.
ironrdp-rdpeudp = "0.1"
ironrdp-rdpeudp-tokio = { version = "0.2", features = ["rustls-ring"] }
# Only for its certificate policy type, which the UDP transport takes.
ironrdp-tls = { version = "0.3", default-features = false }

# `ring` instead of rustls' default `aws-lc-rs`: aws-lc needs CMake and NASM to
# build on Windows, ring needs nothing beyond the C compiler.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The RD Gateway's certificate is checked against the system's trusted roots
# (the gateway is a web server with a real certificate, unlike RDP hosts).
rustls-native-certs = "0.8"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

# `image-data` for pictures both ways; file lists need nothing extra.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
base64 = "0.22"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

# Free space on a shared folder's volume, for Explorer on the server.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The clipboard's change counter, read without opening the clipboard; free
# space, and which drives are fixed ones for "all drives".
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_DataExchange", "Win32_Storage_FileSystem"] }

# The clipboard's change counter.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[dev-dependencies]
tempfile = "3"
# The toy server behind `examples/dev_rdpd.rs` and the integration tests.
# ironrdp-server pulls tokio-rustls with its default (aws-lc) provider, so the
# test build has both providers compiled in; every rustls config in this crate
# names its provider explicitly, which keeps that ambiguity harmless. With
# `egfx` it also serves the graphics pipeline.
# From git: 0.13 on crates.io still pins picky rc.25 (p256 rc.14), which can't
# share a lockfile with ours. This rev is the one IronRDP released connector
# 0.12 from, so it pins picky rc.26 like we do.
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "b13befa0db86f48f523a0b2b007e399f9811e0ec", features = ["egfx"] }
rcgen = "0.14"
anyhow = "1"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# OpenH264 built from source, to encode and decode test pictures. Tests only:
# the app never ships a source build (see the h264 feature).
openh264 = { version = "0.9", features = ["source"] }
