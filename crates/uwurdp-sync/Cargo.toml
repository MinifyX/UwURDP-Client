[package]
name = "uwurdp-sync"
description = "Offline-first sync client for UwURDP: outbox, clocks, conflict resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwurdp-proto.workspace = true
uwurdp-store.workspace = true
uwurdp-vault.workspace = true
zeroize.workspace = true

parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
x509-cert = "0.3.0"
ed25519-dalek = "=3.0.0-rc.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
url = "2.5"
base64.workspace = true
sha2 = "0.11"
webpki-roots = "1.0.9"
