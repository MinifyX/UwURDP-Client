[package]
name = "uwurdp-sync"
description = "Offline-first sync client for UwURDP: outbox, clocks, conflict resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
uwurdp-proto.workspace = true
uwurdp-store.workspace = true
uwurdp-vault.workspace = true
zeroize.workspace = true

parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
x509-cert = "0.3.0"
ed25519-dalek = "=3.0.0-rc.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls-no-provider"] }
url = "2.5"
base64.workspace = true
sha2 = "0.11"
webpki-roots = "1.0.9"
# The operating system's trust store next to the public roots, so a server
# behind a company's or a home network's own CA can be reached too.
rustls-native-certs = "0.8"
spake2 = "0.4"
rand.workspace = true
serde_json.workspace = true
uwulock-core.workspace = true
# The realtime channel of a UwULock Server. Only the handshake and the frames:
# the TLS underneath is this crate's own rustls, as for every request.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
# A UwULock Server in the tests, on 127.0.0.1.
tiny_http = "0.12"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
